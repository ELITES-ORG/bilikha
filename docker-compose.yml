services:
  postgres:
    image: postgres:17-alpine
    container_name: bilikha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bilikha
      POSTGRES_PASSWORD: bilikha
      POSTGRES_DB: bilikha
    ports:
      - '5432:5432'
    volumes:
      - bilikha-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bilikha -d bilikha']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bilikha-pgdata:
