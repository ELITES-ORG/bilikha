name: CI

on:
  push:
  pull_request:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      # Matches docker-compose.yml. Tests run against real Postgres by
      # decision, not by convenience — see ADR 0031.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bilikha
          POSTGRES_PASSWORD: bilikha
          POSTGRES_DB: bilikha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bilikha -d bilikha_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://bilikha:bilikha@localhost:5432/bilikha_test

    steps:
      - uses: actions/checkout@v5
        with:
          # The commit-message check needs history to resolve a range
          # against. Nothing else here reads past the tip.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # The commit-msg hook only protects clones that ran `npm run setup`. An
      # agent pushing from its own environment is exactly how the Cursor
      # trailers reached this repository, so the real enforcement is here.
      # See ADR 0041.
      - name: Commit messages
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="$BASE..$PR_HEAD"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$HEAD_SHA"
          elif git rev-parse -q --verify "$HEAD_SHA^" >/dev/null; then
            # A new branch reports an all-zero `before`. Check its tip, which is
            # the commit that would otherwise slip through unexamined.
            range="$HEAD_SHA~1..$HEAD_SHA"
          else
            range="$HEAD_SHA"  # root commit, nothing to diff against
          fi

          echo "checking $range"
          node scripts/check-commit-msg.mjs --range "$range"

      - name: Install backend
        run: npm ci --prefix backend

      - name: Install frontend
        run: npm ci --prefix frontend

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The test harness migrates and seeds the database itself, in
      # globalSetup, so there is no separate step here to drift from it.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Docs
        run: npm run docs:check
