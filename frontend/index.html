<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Installable, with nothing cached (plan 0036 phase 1). There is no service
      worker on purpose: Chrome dropped the service-worker requirement for
      installing from the menu in 108 on mobile and 112 on desktop, and a worker
      would put a durable cache in front of the update path ADR 0040 just built.

      apple-touch-icon is separate because iOS ignores the manifest's icons.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Bilikha" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Declared before the stylesheet parses so native surfaces the page cannot
      style (scrollbars, text selection, form chrome) follow the same light/dark
      preference as the token palette (ADR 0026).
    -->
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0c121a"
      media="(prefers-color-scheme: dark)"
    />

    <!--
      Apply a stored theme choice before the stylesheet paints (plan 0024).
      Key and valid values must stay in step with src/lib/theme-preference.ts.
      Storage access is wrapped — private browsing and blocked site data throw.

      LIGHT_PAPER / DARK_PAPER also paint the html background so the boot mark
      (plan 0030) sits on the right paper before the stylesheet arrives. One
      pair of literals — do not add a third copy elsewhere.

      The NAVY and SPARK pairs colour the opening curtain the same way. They are
      --color-primary and --color-palayok-500 from theme.css, converted to hex
      because the stylesheet has not arrived; change them together.
    -->
    <script>
      (function () {
        var KEY = 'bilikha-theme';
        var LIGHT_PAPER = '#ffffff';
        var DARK_PAPER = '#0c121a';
        var LIGHT_NAVY = '#032b61';
        var DARK_NAVY = '#274b88';
        var LIGHT_SPARK = '#e63946';
        var DARK_SPARK = '#ef6567';
        var pref = 'system';
        try {
          var raw = localStorage.getItem(KEY);
          if (raw === 'light' || raw === 'dark') pref = raw;
        } catch (e) {}

        var dark =
          pref === 'dark' ||
          (pref === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement.style;
        root.backgroundColor = dark ? DARK_PAPER : LIGHT_PAPER;
        root.setProperty('--bk-boot-navy', dark ? DARK_NAVY : LIGHT_NAVY);
        root.setProperty('--bk-boot-spark', dark ? DARK_SPARK : LIGHT_SPARK);
        // Deliberately NOT setting style.colorScheme here. An inline value
        // outranks every stylesheet rule, including theme.css's
        // `:root[data-theme] { color-scheme }`, and applyThemePreference only
        // touches data-theme — so a runtime theme switch would leave scrollbars,
        // text selection and form chrome on the boot-time scheme, which is the
        // exact thing ADR 0026 uses color-scheme to prevent. The boot mark uses
        // a fixed neutral instead, so it needs no scheme at all.

        if (pref === 'system') return;
        document.documentElement.setAttribute('data-theme', pref);
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        if (metas.length < 2) return;
        var color = pref === 'light' ? LIGHT_PAPER : DARK_PAPER;
        metas[0].content = color;
        metas[0].removeAttribute('media');
        metas[1].content = color;
        metas[1].removeAttribute('media');
      })();
    </script>

    <!--
      Boot mark (plan 0030): the opening curtain, navy with the wordmark, as
      the page transitions draw it (ADR 0034, third amendment). This block
      only — the app stylesheet has not necessarily parsed yet. Opacity stays
      0 for ~400ms so a fast load never shows it; CSS animation-delay, not a
      timer on a busy main thread. React's BootCurtain takes over with the
      same delay and fade (page-transition/boot.ts), then lifts it.
    -->
    <style>
      @keyframes bk-boot-in {
        to {
          opacity: 1;
        }
      }
      @keyframes bk-boot-spark {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.45;
        }
      }
      #bk-boot {
        position: fixed;
        inset: 0;
        z-index: 70;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 1.25rem;
        background: var(--bk-boot-navy, #032b61);
        opacity: 0;
        pointer-events: none;
        animation: bk-boot-in 0.45s ease 0.4s forwards;
      }
      #bk-boot p {
        margin: 0;
        color: #f9fafc;
        font: 600 2.875rem/1.11 'Fraunces Variable', 'Iowan Old Style', Georgia, serif;
        letter-spacing: -0.027em;
        font-variation-settings: 'opsz' 48;
      }
      @media (min-width: 40rem) {
        #bk-boot p {
          font-size: 3.75rem;
          line-height: 1.04;
          letter-spacing: -0.031em;
        }
      }
      #bk-boot b {
        display: inline-block;
        margin-right: 0.75rem;
        font-weight: inherit;
        color: var(--bk-boot-spark, #e63946);
        animation: bk-boot-spark 1.6s ease-in-out infinite;
      }
      #bk-boot span {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }
      /*
        Movement goes; the delayed cross-fade stays — the rule motion.css
        already follows. Killing #bk-boot's animation here made the mark opaque
        from frame 0, so a reduced-motion reader saw it flash on every fast
        load: the failure plan 0030 step 2.2 exists to prevent, scoped to the
        people least well served by a flash.
      */
      @media (prefers-reduced-motion: reduce) {
        #bk-boot b {
          animation: none !important;
        }
      }
    </style>

    <title>Bilikha — Biliran Creative Industries Registry</title>
    <meta
      name="description"
      content="Find and connect with creative talent across Biliran — from filmmakers and musicians to traditional craftsmen and designers."
    />

    <!--
      Static Open Graph tags so shared links render a card on Facebook and
      Messenger. Per-profile tags need server-rendered HTML; Facebook's scraper
      does not execute JavaScript, so these remain generic until that lands.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bilikha" />
    <meta property="og:title" content="Bilikha — Biliran Creative Industries Registry" />
    <meta
      property="og:description"
      content="Find and connect with creative talent across Biliran."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root">
      <!--
        Replaced wholesale when React mounts — do not remove() this (plan 0030).
        A brand mark, not a fake layout: the router does not exist yet.
      -->
      <div id="bk-boot" role="status">
        <p><b aria-hidden="true">✦</b>Bilikha</p>
        <span>Loading Bilikha</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
