<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Declared before the stylesheet parses so native surfaces the page cannot
      style (scrollbars, text selection, form chrome) follow the same light/dark
      preference as the token palette (ADR 0026).
    -->
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#fcfbf8"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#14110e"
      media="(prefers-color-scheme: dark)"
    />

    <!--
      Apply a stored theme choice before the stylesheet paints (plan 0024).
      Key and valid values must stay in step with src/lib/theme-preference.ts.
      Storage access is wrapped — private browsing and blocked site data throw.

      LIGHT_PAPER / DARK_PAPER also paint the html background so the boot mark
      (plan 0030) sits on the right paper before the stylesheet arrives. One
      pair of literals — do not add a third copy elsewhere.
    -->
    <script>
      (function () {
        var KEY = 'bilikha-theme';
        var LIGHT_PAPER = '#fcfbf8';
        var DARK_PAPER = '#14110e';
        var pref = 'system';
        try {
          var raw = localStorage.getItem(KEY);
          if (raw === 'light' || raw === 'dark') pref = raw;
        } catch (e) {}

        var dark =
          pref === 'dark' ||
          (pref === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.style.backgroundColor = dark ? DARK_PAPER : LIGHT_PAPER;
        // So CanvasText on the boot mark matches the paper before the stylesheet
        // defines --color-ink (pinned light on a dark OS would otherwise invert).
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';

        if (pref === 'system') return;
        document.documentElement.setAttribute('data-theme', pref);
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        if (metas.length < 2) return;
        var color = pref === 'light' ? LIGHT_PAPER : DARK_PAPER;
        metas[0].content = color;
        metas[0].removeAttribute('media');
        metas[1].content = color;
        metas[1].removeAttribute('media');
      })();
    </script>

    <!--
      Boot mark (plan 0030). Inline + this block only — the app stylesheet has
      not necessarily parsed yet. Opacity stays 0 for ~400ms so a fast load
      never shows it; CSS animation-delay, not a timer on a busy main thread.
    -->
    <style>
      @keyframes bk-boot-in {
        to {
          opacity: 1;
        }
      }
      @keyframes bk-boot-pulse {
        0%,
        100% {
          opacity: 0.28;
        }
        50% {
          opacity: 0.9;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #bk-boot {
          animation: none !important;
          opacity: 1 !important;
        }
        #bk-boot i {
          animation: none !important;
          opacity: 0.7 !important;
        }
      }
    </style>

    <title>Bilikha — Biliran Creative Industries Registry</title>
    <meta
      name="description"
      content="Find and connect with creative talent across Biliran — from filmmakers and musicians to traditional craftsmen and designers."
    />

    <!--
      Static Open Graph tags so shared links render a card on Facebook and
      Messenger. Per-profile tags need server-rendered HTML; Facebook's scraper
      does not execute JavaScript, so these remain generic until that lands.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bilikha" />
    <meta property="og:title" content="Bilikha — Biliran Creative Industries Registry" />
    <meta
      property="og:description"
      content="Find and connect with creative talent across Biliran."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root">
      <!--
        Replaced wholesale when React mounts — do not remove() this (plan 0030).
        Neutral mark, not a fake layout: the router does not exist yet.
      -->
      <div
        id="bk-boot"
        role="status"
        style="
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 0.5rem;
          opacity: 0;
          color: CanvasText;
          pointer-events: none;
          animation: bk-boot-in 0.45s ease 0.4s forwards;
        "
      >
        <i
          aria-hidden="true"
          style="
            display: block;
            width: 0.4rem;
            height: 0.4rem;
            border-radius: 999px;
            background: currentColor;
            opacity: 0.28;
            animation: bk-boot-pulse 1.8s ease-in-out 0.4s infinite;
          "
        ></i>
        <i
          aria-hidden="true"
          style="
            display: block;
            width: 0.4rem;
            height: 0.4rem;
            border-radius: 999px;
            background: currentColor;
            opacity: 0.28;
            animation: bk-boot-pulse 1.8s ease-in-out 0.55s infinite;
          "
        ></i>
        <i
          aria-hidden="true"
          style="
            display: block;
            width: 0.4rem;
            height: 0.4rem;
            border-radius: 999px;
            background: currentColor;
            opacity: 0.28;
            animation: bk-boot-pulse 1.8s ease-in-out 0.7s infinite;
          "
        ></i>
        <span
          style="
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
          "
          >Loading Bilikha</span
        >
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
