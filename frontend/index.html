<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      The app is light-only, and this has to be declared before the stylesheet
      parses. Native form-control surfaces the page cannot style - most visibly
      a <select>'s option list, which Android draws itself - otherwise follow
      the device theme, so a phone in dark mode gets a dark picker over a light
      page. The :root rule in base.css says the same thing, but too late.
    -->
    <meta name="color-scheme" content="light" />

    <title>Bilikha — Biliran Creative Industries Registry</title>
    <meta
      name="description"
      content="Find and connect with creative talent across Biliran — from filmmakers and musicians to traditional craftsmen and designers."
    />

    <!--
      Static Open Graph tags so shared links render a card on Facebook and
      Messenger. Per-profile tags need server-rendered HTML; Facebook's scraper
      does not execute JavaScript, so these remain generic until that lands.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bilikha" />
    <meta property="og:title" content="Bilikha — Biliran Creative Industries Registry" />
    <meta
      property="og:description"
      content="Find and connect with creative talent across Biliran."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
